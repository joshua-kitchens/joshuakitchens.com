title: Joshua Kitchens
author: Joshua Kitchens
description: Archivist and educator. Case studies for teaching archives and archival issues.
url: https://joshuakitchens.com
lang: en-US

timezone: America/New_York
markdown: kramdown
highlighter: rouge

remote_theme: pages-themes/cayman@v0.2.0

# Header navigation (rendered by _layouts/default.html)
nav:
  - title: Home
    url: /
  - title: Case Studies
    url: /case_studies/
  - title: Vita
    url: /vita/
  - title: About
    url: /about/

collections:
  case_studies:
    output: true
    permalink: /:collection/:name/
  # Old WordPress posts, cleaned up but not yet published.
  # Set output: true (and add a listing page) to put them on the site.
  musings:
    output: false

defaults:
  - scope:
      path: ""
    values:
      layout: default

titles_from_headings:
  enabled: true
  strip_title: false

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

exclude:
  - .vscode
  - Gemfile
  - Gemfile.lock
  - README.md
